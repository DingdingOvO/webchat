apiVersion: v1
kind: ConfigMap
metadata:
  name: webchat-config
  namespace: {{ .Values.namespace }}
data:
  MYSQL_HOST: "{{ .Release.Name }}-mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "webchat"
  MONGO_HOST: "{{ .Release.Name }}-mongodb"
  MONGO_PORT: "27017"
  REDIS_HOST: "{{ .Release.Name }}-redis"
  REDIS_PORT: "6379"
  BACKEND_URL: "http://{{ .Release.Name }}-backend:{{ .Values.backend.port }}"
---
{{- if not .Values.secrets.existingSecret }}
{{/*
  明文 Secret：仅当未提供 secrets.existingSecret 时创建。
  这里用 required 强制校验 —— values.yaml 刻意不给默认值，
  否则用户直接 helm install 就会把占位弱口令带进生产环境。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: webchat-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MYSQL_USER: "root"
  MYSQL_PASSWORD: {{ required "必须设置 secrets.mysqlPassword（或用 secrets.existingSecret 引用已有 Secret）" .Values.secrets.mysqlPassword | quote }}
  JWT_SECRET: {{ required "必须设置 secrets.jwtSecret（或用 secrets.existingSecret 引用已有 Secret）" .Values.secrets.jwtSecret | quote }}
{{- end }}
