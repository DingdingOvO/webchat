# ================================================================
# Fly.io 部署配置
#
# 安装 CLI: curl -L https://fly.io/install.sh | sh
# 部署:     fly launch --copy-config && fly deploy
#
# 注意：本文件是 TOML 格式（不是 YAML）。此前内容误用了 YAML 语法
# （`app: webchat`、`- name:` 等），解析直接报错，配置从未真正生效。
#
# 敏感信息一律通过 fly secrets 注入，不要写进本文件：
#   fly secrets set MYSQL_PASSWORD=... JWT_SECRET=...
#
# 数据库可选用 Fly 托管服务：
#   fly postgres create --name webchat-db
#   fly redis create --name webchat-redis
# ================================================================

app = "webchat"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  MYSQL_HOST = "webchat-mysql.internal"
  MYSQL_PORT = "3306"
  MYSQL_USER = "root"
  MYSQL_DATABASE = "webchat"
  MONGO_HOST = "webchat-mongodb.internal"
  MONGO_PORT = "27017"
  REDIS_HOST = "webchat-redis.internal"
  REDIS_PORT = "6379"

# backend / frontend 拆成两组进程，可独立扩缩容
[processes]
  backend = "java -jar app.jar"
  frontend = "nginx -g 'daemon off;'"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["backend"]

  # 健康检查必须用无需鉴权的端点。/api/auth/me 会强制校验 token，
  # 不带 token 恒定返回 401，会导致实例被反复重启。
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    path = "/actuator/health"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
