name: Quality Gate — Zero-Tolerance

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# 同一分支的新推送取消上一轮未完成的检查：
# 否则连续推送会并行跑多轮全量检查，纯粹浪费 runner 分钟数。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # Frontend Quality
  #
  # ⚠️ job 的 name 是 main 分支保护里登记的必需检查项，必须逐字保持，
  #    否则合并会被永久阻塞。改动前先确认分支保护配置。
  # ================================================================
  frontend-quality:
    name: Frontend — TypeCheck + Lint + Format + Stylelint + Spell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # 本仓库是 npm workspaces 单仓，依赖统一安装在根目录，
          # 因此 lock 文件只有根目录这一份，缓存键也必须指向它。
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Type check
        working-directory: packages/frontend
        run: npx tsc --noEmit

      - name: Biome check (lint + format)
        working-directory: packages/frontend
        run: npx biome check src/

      - name: Stylelint check
        working-directory: packages/frontend
        run: npm run lint:css

      # typos 是 Rust 写的独立二进制，npm 里没有官方包，只能下载 release。
      # 注意：归档里的路径带 ./ 前缀，`tar -xzf x.tar.gz typos` 会匹配失败，
      # 必须整包解压后再取文件。
      - name: Install typos CLI
        run: |
          set -euo pipefail
          VER=1.31.1
          BASE="typos-v${VER}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/crate-ci/typos/releases/download/v${VER}/${BASE}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${BASE}" "${URL}"
          mkdir -p /tmp/typos-dist
          tar -xzf "/tmp/${BASE}" -C /tmp/typos-dist
          install /tmp/typos-dist/typos /usr/local/bin/typos
          typos --version

      - name: Spell check
        working-directory: packages/frontend
        run: npm run spell

      - name: Build
        working-directory: packages/frontend
        run: npm run build

  # ================================================================
  # Backend Quality
  #
  # ⚠️ name 同为分支保护必需检查项。
  # 旧版把 Spotless / Checkstyle / PMD / SpotBugs 拆成 5 个独立 mvn 调用，
  # 每一步都要重新解析依赖与启动 JVM，等于把同一个构建跑了 5 遍。
  # 这些插件已全部绑定到 verify 阶段（见 packages/server/pom.xml），
  # 因此一次 `mvn verify` 即可覆盖全部检查，且行为与本地完全一致。
  # ================================================================
  backend-quality:
    name: Backend — Spotless + Checkstyle + PMD + SpotBugs + Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Verify (spotless + checkstyle + pmd + spotbugs + test + jacoco)
        run: cd packages/server && mvn --batch-mode clean verify

  # ================================================================
  # Secret Scan
  # ================================================================
  secret-scan:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史：密钥可能只在某个旧提交里出现过，
          # 浅克隆会让扫描范围漏掉这些提交。
          fetch-depth: 0

      # 使用开源的 gitleaks CLI，而不是 gitleaks/gitleaks-action@v2。
      # v2 action 自带的商业许可校验会让本仓库的该任务直接失败
      # （它对无法校验许可的账号报「缺少 gitleaks license」），
      # 与本仓库是否真的存在密钥无关。CLI 免费且行为一致，
      # 同时也会读取仓库根目录的 .gitleaks.toml 白名单。
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${BASE}" "${URL}/${BASE}"

          # 按官方 checksums 校验下载包完整性，避免供应链投毒。
          # 不假设清单的行格式（"hash  name" / "hash *name" 都有可能出现）：
          # 这里按文件名匹配该行、取出其中的首个十六进制串作为期望值。
          EXPECTED="$(curl -fsSL --retry 3 --retry-delay 5 "${URL}/gitleaks_${VER}_checksums.txt" \
            | grep -F "${BASE}" | grep -oE '[0-9a-f]{64}' | head -n 1)"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::无法从 checksums 清单中取得 ${BASE} 的校验值"
            exit 1
          fi
          ACTUAL="$(sha256sum "/tmp/${BASE}" | awk '{print $1}')"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::gitleaks 下载包校验失败 expected=${EXPECTED} actual=${ACTUAL}"
            exit 1
          fi

          tar -xzf "/tmp/${BASE}" -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          # 输出 JSON 报告并回显到 job summary：
          # 默认的彩色终端输出在 Actions 日志里不便检索，
          # 而出问题时最需要的恰恰是「哪条规则、哪个文件、哪一行」。
          if gitleaks detect --redact --no-banner --verbose \
               --report-format json --report-path gitleaks-report.json; then
            echo "✅ 未发现密钥" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 发现疑似密钥，以下为脱敏后的明细：" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat gitleaks-report.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(报告文件为空)"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gitleaks 检出疑似密钥，详见 job summary 的脱敏报告"
            exit 1
          fi

  # ================================================================
  # CodeQL
  # ================================================================
  codeql:
    name: CodeQL — Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [java, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
        if: matrix.language == 'java'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
        if: matrix.language == 'java'

      - name: Build Java
        if: matrix.language == 'java'
        run: cd packages/server && mvn clean package -DskipTests -q

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        if: matrix.language == 'java'

      - name: Initialize CodeQL (JavaScript)
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none
        if: matrix.language == 'javascript'

      - name: Perform CodeQL Analysis (JavaScript)
        uses: github/codeql-action/analyze@v4
        if: matrix.language == 'javascript'
