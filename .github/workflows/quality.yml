name: Quality Gate

# ================================================================
# 质量门禁 —— 分支保护的必需检查全部在此产出。
#
# 设计原则：
#   1. 分支保护要求的 6 个 context 名必须逐字稳定，本文件是它们的唯一来源。
#   2. 每个 job 只做一件事，名字必须与「实际执行的检查」完全一致。
#   3. 构建产物由 Build 工作流负责；此处只做「检查」，不重复出包。
# ================================================================

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # 前端质量：TypeCheck + Biome + Stylelint + 拼写 + 构建
  # 检查名里的每一项都真实执行（此前 Stylelint / Spell 只写在名字里）。
  # ================================================================
  frontend-quality:
    name: Frontend — TypeCheck + Lint + Format + Stylelint + Spell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Biome check (lint + format)
        run: npm run lint

      - name: Stylelint check
        run: npm run lint:css

      # 拼写检查：typos CLI 以独立二进制分发（非 npm 包），
      # 在此固定版本安装，扫描范围由 packages/frontend/_typos.toml 定义。
      - name: Install typos CLI
        working-directory: .
        run: |
          set -euo pipefail
          VER=1.31.1
          BASE="typos-v${VER}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/crate-ci/typos/releases/download/v${VER}/${BASE}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${BASE}" "${URL}"
          tar -xzf "/tmp/${BASE}" -C /tmp typos
          install /tmp/typos /usr/local/bin/typos
          typos --version

      - name: Spell check
        run: npm run spell

      - name: Build
        run: npm run build

  # ================================================================
  # 后端质量：Spotless + Checkstyle + PMD + SpotBugs + Verify
  # 单次 mvn verify 已串联全部质量插件；不再逐个重复调用，
  # 也不与 Build 工作流重复构建（后者只负责出 JAR 制品）。
  # ================================================================
  backend-quality:
    name: Backend — Spotless + Checkstyle + PMD + SpotBugs + Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      # verify 阶段在 pom 中已绑定 checkstyle / pmd / spotbugs / jacoco，
      # 一次执行即可覆盖「格式 + 静态检查 + 测试 + 覆盖率」。
      - name: Verify (Spotless + Checkstyle + PMD + SpotBugs + tests + JaCoCo)
        run: cd packages/server && mvn --batch-mode clean verify

  # ================================================================
  # 密钥扫描
  # ================================================================
  secret-scan:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史：密钥可能只在某个旧提交里出现过，
          # 浅克隆会让扫描范围漏掉这些提交。
          fetch-depth: 0

      # 使用开源的 gitleaks CLI，而不是 gitleaks/gitleaks-action@v2。
      # v2 action 自带的商业许可校验会让本仓库的该任务直接失败
      # （它对无法校验许可的账号报「缺少 gitleaks license」），
      # 与本仓库是否真的存在密钥无关。CLI 免费且行为一致，
      # 同时也会读取仓库根目录的 .gitleaks.toml 白名单。
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VER=8.30.1
          BASE="gitleaks_${VER}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -fsSL --retry 3 --retry-delay 5 -o "/tmp/${BASE}" "${URL}/${BASE}"

          # 按官方 checksums 校验下载包完整性，避免供应链投毒。
          # 不假设清单的行格式（"hash  name" / "hash *name" 都有可能出现）：
          # 这里按文件名匹配该行、取出其中的首个十六进制串作为期望值。
          EXPECTED="$(curl -fsSL --retry 3 --retry-delay 5 "${URL}/gitleaks_${VER}_checksums.txt" \
            | grep -F "${BASE}" | grep -oE '[0-9a-f]{64}' | head -n 1)"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::无法从 checksums 清单中取得 ${BASE} 的校验值"
            exit 1
          fi
          ACTUAL="$(sha256sum "/tmp/${BASE}" | awk '{print $1}')"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::gitleaks 下载包校验失败 expected=${EXPECTED} actual=${ACTUAL}"
            exit 1
          fi

          tar -xzf "/tmp/${BASE}" -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          # 输出 JSON 报告并回显到 job summary：
          # 默认的彩色终端输出在 Actions 日志里不便检索，
          # 而出问题时最需要的恰恰是「哪条规则、哪个文件、哪一行」。
          if gitleaks detect --redact --no-banner --verbose \
               --report-format json --report-path gitleaks-report.json; then
            echo "✅ 未发现密钥" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 发现疑似密钥，以下为脱敏后的明细：" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat gitleaks-report.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(报告文件为空)"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gitleaks 检出疑似密钥，详见 job summary 的脱敏报告"
            exit 1
          fi

  # ================================================================
  # CodeQL 安全分析（java / javascript 各一个矩阵任务）
  # 分支保护要求的 context 带语言后缀，由 matrix 自动拼出。
  # ================================================================
  codeql:
    name: CodeQL — Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Initialize CodeQL — Java
        if: matrix.language == 'java'
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Build Java
        if: matrix.language == 'java'
        run: cd packages/server && mvn --batch-mode clean package -DskipTests -q

      - name: Analyze — Java
        if: matrix.language == 'java'
        uses: github/codeql-action/analyze@v3

      - name: Initialize CodeQL — JavaScript
        if: matrix.language == 'javascript'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          build-mode: none

      - name: Analyze — JavaScript
        if: matrix.language == 'javascript'
        uses: github/codeql-action/analyze@v3
