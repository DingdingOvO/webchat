name: Build & Deploy

# ================================================================
# 构建与交付 —— 只负责「出可交付制品」与「部署」。
#
# 与 Quality Gate 的分工：
#   · Quality Gate  → 代码检查（格式/静态分析/测试/覆盖率/安全扫描）
#   · 本工作流      → 出制品（JAR / 前端 dist）+ 构建镜像 + 部署
#
# 因此这里只跑「打包」，不重复执行 spotless / checkstyle / pmd / spotbugs；
# 测试与静态检查已由 Quality Gate 把关，避免同一份后端被构建两遍。
# ================================================================

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ================================================================
  # 构建后端制品（跳过测试：测试已由 Quality Gate 执行）
  # ================================================================
  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: cd packages/server && mvn --batch-mode clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: packages/server/target/*.jar

  # ================================================================
  # 构建前端制品
  # ================================================================
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist

  # ================================================================
  # 构建并推送镜像（仅非 PR）
  # ================================================================
  docker:
    name: Build & Push Docker Images
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: packages/server/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/frontend/dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: packages/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # 部署：SSH（Docker Compose 主机）
  # 未配置 SSH_* secret 时自动跳过，不使流水线失败。
  # ================================================================
  deploy-ssh:
    name: Deploy via SSH
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH secrets
        id: check-ssh
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets not configured, skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to production server
        if: steps.check-ssh.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/webchat
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  # ================================================================
  # 部署：Kubernetes
  # 未配置 KUBE_CONFIG secret 时自动跳过。
  # ================================================================
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check K8s secrets
        id: check-k8s
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG not configured, skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Set up kubectl
        if: steps.check-k8s.outputs.skip == 'false'
        uses: azure/setup-kubectl@v4

      - name: Set up Kubeconfig
        if: steps.check-k8s.outputs.skip == 'false'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Kubernetes
        if: steps.check-k8s.outputs.skip == 'false'
        run: |
          kubectl apply -k deploy/kubernetes/
          kubectl rollout status deployment/webchat-backend -n webchat --timeout=180s
          kubectl rollout status deployment/webchat-frontend -n webchat --timeout=180s
